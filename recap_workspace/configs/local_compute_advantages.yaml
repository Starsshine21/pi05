defaults:
  - model/value@advantage.model

advantage:
  value_checkpoint: /nfs_global/S/yangrongzheng/pi05/recap_workspace/results/recap_value/value_checkpoint
  batch_size: 256
  flush_interval: 128
  num_dataloader_workers_per_gpu: 8
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: local_pi05
  returns_tag: local_pi05
  model:
    critic_expert_variant: gemma_1m
    tokenizer_path: /nfs_global/S/yangrongzheng/pi05/models/google/gemma-3-270m
    siglip_path: /nfs_global/S/yangrongzheng/pi05/models/google/siglip2-so400m-patch14-224
    gemma3_path: /nfs_global/S/yangrongzheng/pi05/models/google/gemma-3-270m

data:
  model_type: pi05
  robot_type: libero
  train_data_paths:
    - dataset_path: /nfs_global/S/yangrongzheng/pi05/data/lerobot_pick_place
      robot_type: libero
      type: sft
      weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: nccl
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
